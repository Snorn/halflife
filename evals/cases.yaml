# Eval cases for the generation engine.
#
# These cost real tokens. They are not run by pytest — see evals/README.md.
# Pick topics you can personally judge: the point of the depth eval is that you
# read the depth-2 and depth-4 pieces and can tell they are different pieces.

depth:
  # Each topic is generated at every depth listed, as issue 1 of a fresh series
  # with no plan, so the only variable is depth.
  depths: [1, 3, 5]
  duration_minutes: 5
  topics:
    - SAP Web Dispatcher
    - Kubernetes admission controllers
    - Postgres connection pooling
    - TLS certificate chains

continuity:
  # One series, generated straight through, to see whether issue N knows what
  # issues 1..N-1 established.
  issues: 6
  depth: 4
  duration_minutes: 5
  topics:
    - Kubernetes admission controllers
