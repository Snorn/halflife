# Eval cases for the generation engine.
#
# These cost real tokens. They are not run by pytest — see evals/README.md.
# Pick topics you can personally judge: the point of the depth eval is that you
# read the depth-2 and depth-4 pieces and can tell they are different pieces.

depth:
  # Each topic is generated at every depth listed, as issue 1 of a fresh series
  # with no plan, so the only variable is depth.
  #
  # The set is chosen along two axes, because three rubric revisions were fitted
  # against the first four topics and a single judge, and further gains against
  # that set are as likely to be fitting the judge as improving the rubric.
  #
  # Axis one, what a depth-5 piece can cite, since checkable specificity is the
  # rubric's own 4-vs-5 boundary and it is not equally reachable everywhere:
  #
  #   open source     source symbols, files, commits, version-specific defaults
  #   standards       RFC and specification sections, errata, interop notes
  #   closed source   vendor notes, documented defaults, support advisories
  #   practice        none of the above — the deliberate stress case
  #
  # Axis two, whether the topic is configurable or conceptual. Every depth-1
  # miss is judged a 2, in the same shape: the piece withholds the vocabulary
  # correctly and then maps relationships and walks a scenario anyway, which is
  # depth 2's deliverable. This axis was added on a guess that conceptual
  # topics were the ones drifting up, and the first run against the wide set
  # disproved it — all three conceptual additions were judged 1 correctly and
  # both misses were configurable topics. The axis stays because it is now
  # measured on both sides rather than assumed on one.
  #
  # All five levels, not the odd ones. The suite tested 1, 3 and 5 for seven
  # runs, during which every single miss was a piece landing in an untested
  # neighbour — depth 1 judged 2, depth 3 judged 4 — so the levels absorbing
  # the errors were never themselves graded. A rubric that scores 24/24 on the
  # odd levels while 2 and 4 go unmeasured is not a rubric known to work.
  #
  # Eight topics across five depths is 96 calls, roughly $7.70 at effort=medium:
  # five generations and five depth judgements per topic, plus two disjointness
  # checks — the widest pair, and depth 2 against depth 4, which is the pair the
  # rubric names in its own opening words and the harder of the two.
  #
  # Use --topic to run a subset when iterating; run the whole set before
  # believing a result.
  depths: [1, 2, 3, 4, 5]
  duration_minutes: 5
  topics:
    # open source, configurable
    - Kubernetes admission controllers
    - Postgres connection pooling
    # open source, conceptual
    - Linux cgroups v2
    # standards, configurable
    - TLS certificate chains
    # standards, conceptual
    - OAuth 2.0 device authorization flow
    # closed source, configurable
    - SAP Web Dispatcher
    - SAP HANA memory management
    # practice — no source, no RFC, no vendor notes, and no version numbers.
    # If depth 5 cannot be reached without artefacts to cite, the rubric has a
    # hole, and it is better to find it here than in someone's subscription.
    - Blameless incident review

plan_ab:
  # Does the series plan earn the extra generation it costs at subscribe time?
  # Both arms run on one topic so the only variable is whether an arc was drawn
  # up in advance. Deliberately a different topic from the continuity suite, so
  # the answer is not read off the one series we have already looked at.
  topic: Postgres connection pooling
  depth: 4
  duration_minutes: 5
  issues: 6

continuity:
  # One series, generated straight through, to see whether issue N knows what
  # issues 1..N-1 established.
  #
  # Deliberately narrow where the depth set is wide: a continuity run is nine
  # calls per topic, and its output is also the baseline the distance suite
  # scores against, so topics here are worth adding one at a time and keeping.
  issues: 6
  depth: 4
  duration_minutes: 5
  topics:
    - Kubernetes admission controllers
